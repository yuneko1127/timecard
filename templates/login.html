{% extends "base.html" %}

{% block content %}
<section class="card">
  <h2>ログイン</h2>
  <form method="post">
    {% if use_supabase_auth %}
    <label>メールアドレス
      <input name="email" type="email" required />
    </label>
    {% else %}
    <label>ログインID
      <input name="email" required />
    </label>
    {% endif %}
    <label>パスワード
      <input name="password" type="password" required />
    </label>
    <button type="submit">ログイン</button>
  </form>
</section>
{% endblock %}
